name: eczanem
description: Konuma göre eczane bulma ve ilaç hatırlatma uygulaması.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.1
  geolocator: ^14.0.3
  flutter_local_notifications: ^22.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.4.0
  provider: ^6.1.5
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.3.2
  intl: ^0.20.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/data/il_ilce.json
    - public/data/pharmacies_latest.json
