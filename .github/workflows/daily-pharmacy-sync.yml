name: Daily free pharmacy data sync

on:
  schedule:
    # 06:00 UTC = 09:00 Türkiye saati
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate free pharmacy JSON
        run: node data_sync/sync_pharmacies.mjs

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update daily free pharmacy data'
          file_pattern: public/data/pharmacies_latest.json
